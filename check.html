<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Lottery Result - Live</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    /* Live Time & Date Header */
    .top-header {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      color: #334155;
      font-weight: 600;
      margin-bottom: 15px;
      border: 1px solid #e2e8f0;
    }

    /* Blinking Live Section */
    .live-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #dc2626;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .red-dot {
      width: 12px;
      height: 12px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      0% {
        opacity: 1;
        box-shadow: 0 0 10px #ef4444;
      }
      100% {
        opacity: 0.2;
        box-shadow: none;
      }
    }

    h2 {
      text-align: center;
      margin: 0 0 16px 0;
      color: #0f172a;
      font-size: 22px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.95;
    }

    #resultBox {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      display: none;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      line-height: 1.7;
      font-size: 14px;
    }

    #resultBox p {
      margin: 6px 0;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 12px;
    }

    .Paid {
      background: #dcfce7;
      color: #15803d;
    }

    .Pending {
      background: #fef9c3;
      color: #a16207;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Real Time Date & Time -->
    <div class="top-header" id="liveClock">Loading Date & Time...</div>

    <!-- Blinking Live Result Section -->
    <div class="live-badge">
      <span class="red-dot"></span>
      Live result check
    </div>

    <h2>Lottery Result Check</h2>

    <input type="text" id="searchKey" placeholder="Ticket No ya Mobile No dalein">
    <button onclick="checkResult()">Check Result</button>

    <div id="resultBox"></div>
  </div>

  <script>
    const API_URL = "https://sheetdb.io/api/v1/osehsg02p213h";

    // Live Date and Clock Function
    function updateClock() {
      const now = new Date();
      const options = { 
        weekday: 'short', 
        day: '2-digit', 
        month: 'short', 
        year: 'numeric',
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: true 
      };
      document.getElementById("liveClock").innerText = now.toLocaleString('en-IN', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Check Result Search Logic
    async function checkResult() {
      const query = document.getElementById("searchKey").value.trim();
      const resultBox = document.getElementById("resultBox");

      if (!query) {
        alert("Kripya Ticket Number ya Mobile Number dalein!");
        return;
      }

      resultBox.style.display = "block";
      resultBox.innerHTML = "<p style='color: #2563eb; margin:0;'>Checking result...</p>";

      try {
        const encoded = encodeURIComponent(query);
        // Pehle ticket number se search karega
        let res = await fetch(`${API_URL}/search?ticket=${encoded}&casesensitive=false`);
        let data = await res.json();

        // Agar ticket se na mile toh mobile number se search karega
        if (!data || data.length === 0) {
          res = await fetch(`${API_URL}/search?mobile=${encoded}&casesensitive=false`);
          data = await res.json();
        }

        if (data && data.length > 0) {
          const item = data[0];
          resultBox.innerHTML = `
            <p><strong>Name:</strong> ${item.name || '-'}</p>
            <p><strong>Ticket:</strong> ${item.ticket || '-'}</p>
            <p><strong>UPI ID:</strong> ${item.upiId || '-'}</p>
            <p><strong>Prize:</strong> ${item.prize || '-'}</p>
            <p><strong>Prize Amount:</strong> ₹${item.amount || '-'}</p>
            <p><strong>Fee / Charges:</strong> ₹${item.fee || '-'}</p>
            <p><strong>Status:</strong> <span class="status-badge ${item.status}">${item.status || '-'}</span></p>
          `;
        } else {
          resultBox.innerHTML = "<p style='color:#dc2626; margin:0;'>Koi record nahi mila. Ticket/Mobile number sahi se check karein.</p>";
        }
      } catch (err) {
        resultBox.innerHTML = "<p style='color:#dc2626; margin:0;'>Error: SheetDB se connect nahi ho paya.</p>";
      }
    }
  </script>
</body>
</html>
