 <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Lottery Result</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: #fff; padding: 25px; border-radius: 10px; max-width: 450px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-top: 0; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
    #resultBox { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; background: #f8f9fa; border: 1px solid #ddd; }
    .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .Paid { background: #d4edda; color: #155724; }
    .Pending { background: #fff3cd; color: #856404; }
  </style>
</head>
<body>

<div class="card">
  <h2>Check Lottery Result</h2>
  <input type="text" id="searchKey" placeholder="Apna Ticket ya Mobile Number dalein">
  <button onclick="checkResult()">Check Result</button>

  <div id="resultBox"></div>
</div>

<script>
  const API_URL = "https://sheetdb.io/api/v1/osehsg02p213h";

  async function checkResult() {
    const query = document.getElementById("searchKey").value.trim();
    const resultBox = document.getElementById("resultBox");

    if (!query) {
      alert("Kripya Ticket Number ya Mobile Number dalein!");
      return;
    }

    resultBox.style.display = "block";
    resultBox.innerHTML = "Checking result...";

    try {
      // Pehle ticket se check karega, agar nahi mila toh mobile se
      let res = await fetch(`${API_URL}/search?ticket=${query}`);
      let data = await res.json();

      if (!data || data.length === 0) {
        res = await fetch(`${API_URL}/search?mobile=${query}`);
        data = await res.json();
      }

      if (data && data.length > 0) {
        const item = data[0];
        resultBox.innerHTML = `
          <p><strong>Name:</strong> ${item.name || '-'}</p>
          <p><strong>Ticket:</strong> ${item.ticket || '-'}</p>
          <p><strong>UPI ID:</strong> ${item.upiId || '-'}</p>
          <p><strong>Prize:</strong> ${item.prize || '-'}</p>
          <p><strong>Prize Amount:</strong> ₹${item.amount || '-'}</p>
          <p><strong>Fee / Charges:</strong> ₹${item.fee || '-'}</p>
          <p><strong>Status:</strong> <span class="status-badge ${item.status}">${item.status || '-'}</span></p>
        `;
      } else {
        resultBox.innerHTML = "<p style='color:red; margin:0;'>Koi record nahi mila. Ticket/Mobile number check karein.</p>";
      }
    } catch (err) {
      resultBox.innerHTML = "<p style='color:red; margin:0;'>Error: Data fetch karne me pareshani aayi.</p>";
    }
  }
</script>

</body>
</html>
