<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Data Entry</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }
    h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 20px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #475569;
    }
    input, select {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #2563eb;
    }
    .btn-submit {
      grid-column: 1 / -1;
      padding: 13px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    #statusMessage {
      font-weight: 600;
      font-size: 14px;
      margin-top: 12px;
      color: #2563eb;
    }
    .table-container {
      overflow-x: auto;
      margin-top: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    th {
      background: #f8fafc;
      color: #475569;
      padding: 12px 10px;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
    }
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 11px;
    }
    .badge-paid {
      background: #dcfce7;
      color: #15803d;
    }
    .badge-pending {
      background: #fef9c3;
      color: #a16207;
    }
    .btn-delete {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>+ Naya Record Enter Karein (Google Sheet)</h2>
      <form id="recordForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" placeholder="User ka naam" required>
          </div>
          <div class="form-group">
            <label>Ticket No</label>
            <input type="text" id="ticket" placeholder="Jaise: KL-102" required>
          </div>
          <div class="form-group">
            <label>Mobile No</label>
            <input type="tel" id="mobile" placeholder="Mobile number" required>
          </div>
          <div class="form-group">
            <label>Prize Name</label>
            <input type="text" id="prize" placeholder="Jaise: 1st Prize" required>
          </div>
          <div class="form-group">
            <label>Prize Amount (₹)</label>
            <input type="number" id="amount" placeholder="50000" required>
          </div>
          <div class="form-group">
            <label>Fee / Charges (₹)</label>
            <input type="number" id="fee" placeholder="0" required>
          </div>
          <div class="form-group">
            <label>UPI ID</label>
            <input type="text" id="upiId" placeholder="example@upi" required>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="Pending">Pending</option>
              <option value="Paid">Paid</option>
            </select>
          </div>
          <button type="submit" id="addBtn" class="btn-submit">+ Google Sheet me Save Karein</button>
        </div>
      </form>
      <div id="statusMessage"></div>
    </div>

    <div class="card">
      <h2>Live Saved Records</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Ticket</th>
              <th>Mobile</th>
              <th>Prize</th>
              <th>Amount</th>
              <th>Fee</th>
              <th>UPI ID</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="9" style="text-align:center;">Sheet se data check ho raha hai...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://sheetdb.io/api/v1/osehsg02p213h";
    const statusMessage = document.getElementById("statusMessage");
    const tableBody = document.getElementById("tableBody");
    const form = document.getElementById("recordForm");
    const addBtn = document.getElementById("addBtn");

    async function loadData() {
      statusMessage.innerText = "Sheet se data sync ho raha hai...";
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("HTTP Status " + res.status);
        const data = await res.json();
        renderTable(data);
        statusMessage.innerText = "Data update ho gaya!";
      } catch (err) {
        statusMessage.innerText = "Data load nahi ho paya: " + err.message;
      }
    }

    function renderTable(list) {
      tableBody.innerHTML = "";
      if (!list || !Array.isArray(list) || list.length === 0) {
        tableBody.innerHTML = "<tr><td colspan='9' style='text-align:center;'>Sheet me abhi koi record nahi mila</td></tr>";
        return;
      }
      list.forEach(item => {
        const isPaid = (item.status || "").toLowerCase() === "paid";
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.name || "-"}</td>
          <td><b>${item.ticket || "-"}</b></td>
          <td>${item.mobile || "-"}</td>
          <td>${item.prize || "-"}</td>
          <td>₹${item.amount || "0"}</td>
          <td>₹${item.fee || "0"}</td>
          <td>${item.upiId || "-"}</td>
          <td><span class="badge ${isPaid ? 'badge-paid' : 'badge-pending'}">${item.status || "Pending"}</span></td>
          <td><button class="btn-delete" onclick="deleteRecord('${item.ticket}')">Delete</button></td>
        `;
        tableBody.appendChild(row);
      });
    }

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      addBtn.disabled = true;
      statusMessage.innerText = "Google Sheet me save ho raha hai...";

      const newRecord = {
        name: document.getElementById("name").value.trim(),
        ticket: document.getElementById("ticket").value.trim(),
        mobile: document.getElementById("mobile").value.trim(),
        prize: document.getElementById("prize").value.trim(),
        amount: document.getElementById("amount").value.trim(),
        fee: document.getElementById("fee").value.trim(),
        upiId: document.getElementById("upiId").value.trim(),
        status: document.getElementById("status").value
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Accept": "application/json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ data: [newRecord] })
        });

        const result = await res.json();

        if (!res.ok || result.error || !result.created) {
          throw new Error(result.error || result.message || JSON.stringify(result));
        }

        statusMessage.innerText = "Record successfully Google Sheet me save ho gaya!";
        form.reset();
        setTimeout(loadData, 800);
      } catch (err) {
        statusMessage.innerText = "Save nahi hua! Wajah: " + err.message;
      } finally {
        addBtn.disabled = false;
      }
    });

    async function deleteRecord(ticketNo) {
      if (!confirm(`Kya aap ticket "${ticketNo}" ko delete karna chahte hain?`)) return;
      statusMessage.innerText = "Delete ho raha hai...";
      try {
        const res = await fetch(`${API_URL}/ticket/${encodeURIComponent(ticketNo)}`, {
          method: "DELETE",
          headers: {
            "Accept": "application/json",
            "Content-Type": "application/json"
          }
        });
        if (!res.ok) throw new Error("Delete failed");
        setTimeout(loadData, 500);
      } catch (err) {
        statusMessage.innerText = "Delete error: " + err.message;
      }
    }

    loadData();
  </script>
</body>
</html>
