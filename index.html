<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lottery Management Panel</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; margin-top: 0; color: #1a1a1a; }
    
    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 12px; 
      margin-bottom: 15px; 
    }
    input, select { 
      width: 100%; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
      font-size: 14px; 
    }
    .btn-submit { 
      grid-column: 1 / -1; 
      padding: 12px; 
      background: #28a745; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
    }
    .btn-submit:hover { background: #218838; }

    #statusMessage { font-size: 14px; color: #555; text-align: center; margin: 10px 0; font-weight: 500; }

    .table-container { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { border: 1px solid #e1e4e8; padding: 10px 12px; text-align: left; font-size: 13px; }
    th { background: #007bff; color: white; white-space: nowrap; }
    tr:nth-child(even) { background: #f9fbfd; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; }
    .badge-paid { background: #d4edda; color: #155724; }
    .badge-pending { background: #fff3cd; color: #856404; }

    .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    .btn-delete:hover { background: #bd2130; }
  </style>
</head>
<body>

<div class="container">
  <h2>Lottery Management Panel</h2>

  <form id="recordForm">
    <div class="form-grid">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="text" id="ticket" placeholder="Ticket Number" required>
      <input type="text" id="mobile" placeholder="Mobile Number" required>
      <input type="text" id="prize" placeholder="Prize (e.g. 1st, 2nd)" required>
      <input type="number" id="amount" placeholder="Prize Amount (₹)" required>
      <input type="number" id="fee" placeholder="Fee / Charges (₹)" required>
      <input type="text" id="upiId" placeholder="UPI ID" required>
      <select id="status">
        <option value="Pending">Pending</option>
        <option value="Paid">Paid</option>
      </select>
      <button type="submit" class="btn-submit" id="addBtn">+ Naya Record Add Karein</button>
    </div>
  </form>

  <div id="statusMessage">Data load ho raha hai...</div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Ticket</th>
          <th>Mobile</th>
          <th>Prize</th>
          <th>Amount</th>
          <th>Fee</th>
          <th>UPI ID</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = "https://sheetdb.io/api/v1/osehsg02p213h";
  const statusMessage = document.getElementById("statusMessage");
  const tableBody = document.getElementById("tableBody");
  const form = document.getElementById("recordForm");

  // 1. SheetDB se data fetch karna
  async function loadData() {
    statusMessage.innerText = "Sheet se data sync ho raha hai...";
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      renderTable(data);
      statusMessage.innerText = "Data update ho gaya!";
    } catch (err) {
      statusMessage.innerText = "Data load nahi ho paya: " + err.message;
    }
  }

  // 2. Table me data display karna
  function renderTable(list) {
    tableBody.innerHTML = "";
    if (!list || list.length === 0) {
      tableBody.innerHTML = "<tr><td colspan='9' style='text-align:center;'>Koi record uplabdh nahi hai</td></tr>";
      return;
    }

    list.forEach(item => {
      const statusClass = (item.status || "").toLowerCase() === "paid" ? "badge-paid" : "badge-pending";
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${item.name || "-"}</td>
        <td><b>${item.ticket || "-"}</b></td>
        <td>${item.mobile || "-"}</td>
        <td>${item.prize || "-"}</td>
        <td>₹${item.amount || "0"}</td>
        <td>₹${item.fee || "0"}</td>
        <td>${item.upiId || "-"}</td>
        <td><span class="badge ${statusClass}">${item.status || "Pending"}</span></td>
        <td>
          <button class="btn-delete" onclick="deleteRecord('${item.ticket}')">Delete</button>
        </td>
      `;
      tableBody.appendChild(row);
    });
  }

  // 3. Naya record save karna
  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    const addBtn = document.getElementById("addBtn");
    addBtn.disabled = true;
    statusMessage.innerText = "Google Sheet me save ho raha hai...";

    const newRecord = {
      name: document.getElementById("name").value.trim(),
      ticket: document.getElementById("ticket").value.trim(),
      mobile: document.getElementById("mobile").value.trim(),
      prize: document.getElementById("prize").value.trim(),
      amount: document.getElementById("amount").value.trim(),
      fee: document.getElementById("fee").value.trim(),
      upiId: document.getElementById("upiId").value.trim(),
      status: document.getElementById("status").value
    };

    try {
      await fetch(API_URL, {
        method: "POST",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ data: [newRecord] })
      });

      form.reset();
      loadData();
    } catch (err) {
      statusMessage.innerText = "Save karne me error aaya: " + err.message;
    } finally {
      addBtn.disabled = false;
    }
  });

  // 4. Ticket number se record delete karna
  async function deleteRecord(ticketNo) {
    if (!confirm(`Kya aap ticket "${ticketNo}" ko delete karna chahte hain?`)) return;
    statusMessage.innerText = "Delete ho raha hai...";

    try {
      await fetch(`${API_URL}/ticket/${encodeURIComponent(ticketNo)}`, {
        method: "DELETE"
      });
      loadData();
    } catch (err) {
      statusMessage.innerText = "Delete error: " + err.message;
    }
  }

  // Page start hote hi data pull karein
  loadData();
</script>

</body>
</html>
